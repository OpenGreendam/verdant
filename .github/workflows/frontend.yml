name: RIIP pinned generation (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riip-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=512
      PROTO_UI_UPSTREAM: ${{ github.workspace }}/.ci/proto-ui-upstream
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the isolated generation commit
        run: |
          test "$(git rev-parse HEAD^)" = b0647a1a35ceaab3c7327f8f4112eb1190fe91ef
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/frontend.yml
          mkdir -p .ci/riip-generation/logs
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.32.1'
      - uses: actions/checkout@v4
        with:
          repository: Proto-UI/Proto-UI
          ref: e9340df6279e063cf372080bf4cc97caea3fd901
          path: .ci/proto-ui-upstream
          persist-credentials: false
      - name: Fetch the separately pinned Input source
        run: git -C .ci/proto-ui-upstream fetch --no-tags --depth=1 origin 4e499ae25e825e130e740f16af66d70b23a743cf
      - name: Install the locked producer and compiler
        run: |
          pnpm --dir frontend/proto-ui install --frozen-lockfile --ignore-scripts
          pnpm --dir .ci/proto-ui-upstream install --frozen-lockfile --ignore-scripts
          test "$(git -C .ci/proto-ui-upstream rev-parse HEAD)" = e9340df6279e063cf372080bf4cc97caea3fd901
          test -z "$(git -C .ci/proto-ui-upstream status --porcelain)"
      - name: Focused authored timeline regression
        run: node --test --test-concurrency=1 frontend/proto-ui/tools/test/continuous-control.test.mjs | tee .ci/riip-generation/logs/continuous.log
      - name: Generate every unit with the pinned compiler
        run: node frontend/proto-ui/tools/build-proto-ui.mjs --upstream .ci/proto-ui-upstream | tee .ci/riip-generation/logs/generate.log
      - name: Full source and producer regression
        run: node --test --test-concurrency=1 frontend/proto-ui/tools/test/*.test.mjs | tee .ci/riip-generation/logs/source-suite.log
      - name: Independently check fresh outputs
        run: node frontend/proto-ui/tools/build-proto-ui.mjs --check --upstream .ci/proto-ui-upstream | tee .ci/riip-generation/logs/fresh-check.log
      - name: Check retained closure
        run: node frontend/proto-ui/tools/build-proto-ui.mjs --check-retained | tee .ci/riip-generation/logs/retained-check.log
      - name: Export only generated artifacts and receipts
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          out = root / ".ci/riip-generation"
          extra = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard",
              "frontend/proto-ui/generated", "frontend/proto-ui/receipts"], text=True).splitlines()
          if extra:
              subprocess.run(["git", "add", "--intent-to-add", "--", *extra], check=True)
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert changed, "expected the new ContinuousControl artifacts"
          for name in changed:
              assert name.startswith(("frontend/proto-ui/generated/", "frontend/proto-ui/receipts/")) or name == "frontend/proto-ui/compiler.pin.json", name
              assert (root/name).is_file() and not (root/name).is_symlink(), name
          subprocess.run(["git", "diff", "--check"], check=True)
          manifest = {
              "schema": "verdant.riip.generated-export.v1",
              "sourceCommit": "b0647a1a35ceaab3c7327f8f4112eb1190fe91ef",
              "workflowCommit": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "compiler": "e9340df6279e063cf372080bf4cc97caea3fd901",
              "files": [{"path": name, "sha256": hashlib.sha256((root/name).read_bytes()).hexdigest(),
                         "bytes": (root/name).stat().st_size} for name in changed],
          }
          (out/"manifest.json").write_text(json.dumps(manifest, indent=2)+"\n")
          (out/"generated.patch").write_bytes(subprocess.check_output(["git", "diff", "--binary", "--", *changed]))
          with tarfile.open(out/"generated.tar.gz", "w:gz") as archive:
              for name in changed:
                  archive.add(root/name, arcname=name, recursive=False)
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riip-timeline-generated
          path: .ci/riip-generation/
          include-hidden-files: true
          if-no-files-found: error
