name: Windows offline first use
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: windows-2025
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci-rc6
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          artifact-ids: 15121876945
          run-id: 45826238304
          path: package
          merge-multiple: true
      - name: Verify real network isolation and first synthesis
        run: ./ci-rc6/offline.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-offline-first-use
          path: offline-evidence/
          if-no-files-found: error
