name: release-guard

on:
  release:
    types: [published, created, edited]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      artifact_policy:
        description: Reviewed repository-relative artifact policy (optional)
        type: string
        default: ""
      artifact_policy_sha256:
        description: Independently approved artifact policy SHA-256 (optional)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  guard:
    # Retain the platform build/test/generation gates and audit their actual
    # packages below. The source offer is part of every runtime package.
    uses: ./.github/workflows/frontend.yml

  audit:
    needs: guard
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_POLICY: ${{ inputs.artifact_policy || vars.VERDANT_RELEASE_ARTIFACT_POLICY || (github.event_name == 'release' && !github.event.release.prerelease && 'frontend/packaging/verdant-voice/POLICY.json') }}
      ARTIFACT_POLICY_SHA256: ${{ inputs.artifact_policy_sha256 || vars.VERDANT_RELEASE_ARTIFACT_POLICY_SHA256 || (github.event_name == 'release' && !github.event.release.prerelease && '3056e223b2acb1c91da21d35e629c370a02897d8b0f4bd134064435fbc55464b') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: verdant-*
          path: .ci/guarded-builds
          merge-multiple: false
      - name: Build the native auditor in the development container
        run: |
          docker build --tag verdant-release-dev --file frontend/Dockerfile frontend
          mkdir -p .ci/guard-target
          docker run --rm --memory=8g --cpus=2 \
            --mount type=bind,src="$PWD",dst=/workspace \
            --mount type=bind,src="$PWD/.ci/guard-target",dst=/build \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/workspace \
            verdant-release-dev sh -ec '
              cargo fetch --locked
              cargo build --offline --locked -p verdant-release
              /build/debug/verdant-release select-source --repo /workspace \
                --output /workspace/.ci/guard-source-selection.json
            '
      - name: Audit the current built packages and selected source
        run: |
          selected_sha256=$(sha256sum .ci/guard-source-selection.json | cut -d ' ' -f 1)
          source_commit=$(git rev-parse HEAD)
          policy_args=()
          if [ -n "$ARTIFACT_POLICY" ] || [ -n "$ARTIFACT_POLICY_SHA256" ]; then
            test -n "$ARTIFACT_POLICY" && test -n "$ARTIFACT_POLICY_SHA256"
            policy_args=(--artifact-policy "/workspace/$ARTIFACT_POLICY" --artifact-policy-sha256 "$ARTIFACT_POLICY_SHA256")
          fi
          docker run --rm --memory=2g --cpus=2 \
            --mount type=bind,src="$PWD",dst=/workspace,readonly \
            --mount type=bind,src="$PWD/.ci/guard-target",dst=/build,readonly \
            verdant-release-dev /build/debug/verdant-release check \
              --check /workspace/.ci/guarded-builds --require-package \
              --expected-source-commit "$source_commit" \
              --expected-source-selection-sha256 "$selected_sha256" "${policy_args[@]}"
      - name: Read the assets actually attached to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p .ci/published-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir .ci/published-assets
      - name: Audit the published assets and formal voice requirement
        if: github.event_name == 'release'
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          selected_sha256=$(sha256sum .ci/guard-source-selection.json | cut -d ' ' -f 1)
          source_commit=$(git rev-parse HEAD)
          policy_args=()
          if [ -n "$ARTIFACT_POLICY" ] || [ -n "$ARTIFACT_POLICY_SHA256" ]; then
            test -n "$ARTIFACT_POLICY" && test -n "$ARTIFACT_POLICY_SHA256"
            policy_args=(--artifact-policy "/workspace/$ARTIFACT_POLICY" --artifact-policy-sha256 "$ARTIFACT_POLICY_SHA256")
          fi
          voice_args=()
          if [ "$IS_PRERELEASE" != true ]; then voice_args=(--require-voice); fi
          docker run --rm --memory=2g --cpus=2 \
            --mount type=bind,src="$PWD",dst=/workspace,readonly \
            --mount type=bind,src="$PWD/.ci/guard-target",dst=/build,readonly \
            verdant-release-dev /build/debug/verdant-release check \
              --check /workspace/.ci/published-assets --require-package \
              --expected-source-commit "$source_commit" \
              --expected-source-selection-sha256 "$selected_sha256" \
              "${policy_args[@]}" "${voice_args[@]}"
