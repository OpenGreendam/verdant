name: Linux native RC7 package
on:
  push:
    branches: [ci/rc7-linux-J0ldUT5O]
    paths: [ci-rc6-linux/source.sha]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout: ci-rc6-linux
          persist-credentials: false
      - name: Read the approved merged source
        id: source
        run: |
          source_sha=$(cat driver/ci-rc6-linux/source.sha)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: OpenGreendam/verdant
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            .ci/cargo/registry
            .ci/cargo/git
            .ci/target
          key: ${{ runner.os }}-verdant-${{ hashFiles('source/frontend/Cargo.lock', 'source/frontend/Dockerfile') }}
      - name: Fetch the published RC6 bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous .ci/cargo .ci/target evidence
          gh release download v0.1.0-rc.6 --repo OpenGreendam/verdant --pattern 'verdant-0.1.0-linux-x86_64-with-voice.tar.gz' --dir previous
          digest=$(jq -er .prior_archive_sha256 driver/ci-rc6-linux/run.json)
          printf '%s  %s\n' "$digest" previous/verdant-0.1.0-linux-x86_64-with-voice.tar.gz | sha256sum -c -
          tar -xzf previous/verdant-0.1.0-linux-x86_64-with-voice.tar.gz -C previous
      - name: Build the pinned Linux development image and fetch locked dependencies
        run: |
          docker build -t verdant-rc7-dev -f source/frontend/Dockerfile source/frontend
          docker run --rm -v "$PWD/source:/workspace:ro" -v "$PWD/.ci/cargo:/cargo-cache" -e CARGO_HOME=/cargo-cache verdant-rc7-dev cargo fetch --locked
      - name: Build, guard, and render with the bundled voice offline
        run: |
          docker run --rm --network none --shm-size=3g --tmpfs /fast:rw,exec,size=2g \
            -v "$PWD/source:/workspace:ro" -v "$PWD/driver/ci-rc6-linux:/driver:ro" \
            -v "$PWD/previous/verdant-0.1.0-linux-x86_64:/previous:ro" \
            -v "$PWD/.ci/cargo:/cargo-cache" -v "$PWD/.ci/target:/build" -v "$PWD/evidence:/evidence" \
            -e CARGO_HOME=/cargo-cache -e TMPDIR=/fast -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_SHA \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace \
            verdant-rc7-dev bash /driver/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rc7-linux-${{ steps.source.outputs.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rc7-linux-diagnostics-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          compression-level: 0
