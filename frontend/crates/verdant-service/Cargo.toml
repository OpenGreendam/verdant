[package]
name = "verdant-service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
async-channel = "2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
verdant-audio = { path = "../verdant-audio", default-features = false }
verdant-backend = { path = "../verdant-backend" }
verdant-domain = { path = "../verdant-domain" }
verdant-media = { path = "../verdant-media" }
verdant-plugins = { path = "../verdant-plugins" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
