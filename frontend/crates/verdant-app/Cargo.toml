[package]
name = "verdant-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Verdant 翠绿 — GPUI singing-voice editor."

[[bin]]
name = "verdant-gui"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# Native text selection notification is a separate host capability from the Element ABI.
proto-ui-gpui-native = { version = "=0.2.0", path = "../../proto-ui/generated/pitch-gesture-surface/.proto-ui/gpui-native", features = ["gpui-text-selection-notification"] }
verdant-domain = { path = "../verdant-domain" }
verdant-session = { path = "../verdant-session" }
verdant-ui-protocol = { path = "../verdant-ui-protocol" }
verdant-backend = { path = "../verdant-backend" }
verdant-service = { path = "../verdant-service" }
verdant-audio = { path = "../verdant-audio" }
verdant-plugins = { path = "../verdant-plugins" }
verdant-import = { path = "../verdant-import" }
verdant-exchange = { path = "../verdant-exchange" }
verdant-midi = { path = "../verdant-midi" }
verdant-media = { path = "../verdant-media" }
verdant-pitch-gesture-surface = { package = "generated-gpui-c77c3274cff416fb9f1443d0f0dbb6ef", path = "../../proto-ui/generated/pitch-gesture-surface" }
verdant-normalized-knob = { package = "generated-gpui-4498881630ff6ed192d401c5efa20d08", path = "../../proto-ui/generated/normalized-knob" }
verdant-action-control = { package = "generated-gpui-ed34da374ae919546d076ccbe2751ef4", path = "../../proto-ui/generated/action-control" }
verdant-collection-control = { package = "generated-gpui-ab387781a863759d22aa611ba9bffc55", path = "../../proto-ui/generated/collection-control" }
verdant-continuous-control = { package = "generated-gpui-6cea3b9b5774accb2474915e2921fa83", path = "../../proto-ui/generated/continuous-control" }
verdant-editor-surface = { package = "generated-gpui-b482e3580273d3793849dd46be364a38", path = "../../proto-ui/generated/editor-surface" }
verdant-performance-key = { package = "generated-gpui-3bc8d6cf457a74bdf278cb1b042336e6", path = "../../proto-ui/generated/performance-key" }
verdant-drag-source = { package = "generated-gpui-cab661c69e21f84c6f0b8d42702bac16", path = "../../proto-ui/generated/drag-source" }
verdant-overlay-control = { package = "generated-gpui-c95b53accf92907139eb07f9b02b4adf", path = "../../proto-ui/generated/overlay-control" }
verdant-text-field = { package = "generated-gpui-5aa1c6a383ac379ab1bc4630ae1c59f5", path = "../../proto-ui/generated/text-field" }
verdant-graph-point = { package = "generated-gpui-016c767e39c58274728185baec2a3fa4", path = "../../proto-ui/generated/graph-point" }
verdant-scroll-region = { package = "generated-gpui-9dea1709f3ac20d540d209c81f3d4450", path = "../../proto-ui/generated/scroll-region" }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1"
async-channel = "2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Native input inspection is available only to the compiled consumer regressions.
proto-ui-gpui-native = { version = "=0.2.0", path = "../../proto-ui/generated/pitch-gesture-surface/.proto-ui/gpui-native", features = ["test-support"] }
