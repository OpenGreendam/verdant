[package]
name = "verdant-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Verdant 翠绿 — GPUI singing-voice editor."

[[bin]]
name = "verdant-gui"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
verdant-domain = { path = "../verdant-domain" }
verdant-session = { path = "../verdant-session" }
verdant-ui-protocol = { path = "../verdant-ui-protocol" }
verdant-backend = { path = "../verdant-backend" }
verdant-service = { path = "../verdant-service" }
verdant-audio = { path = "../verdant-audio" }
verdant-plugins = { path = "../verdant-plugins" }
verdant-import = { path = "../verdant-import" }
verdant-exchange = { path = "../verdant-exchange" }
verdant-midi = { path = "../verdant-midi" }
verdant-media = { path = "../verdant-media" }
verdant-pitch-gesture-surface = { package = "generated-gpui-c83a124412651f7e826e49a5c0cb29a5", path = "../../proto-ui/generated/pitch-gesture-surface" }
verdant-normalized-knob = { package = "generated-gpui-5b827fa1958b618c7f85aca43bbfa453", path = "../../proto-ui/generated/normalized-knob" }
verdant-action-control = { package = "generated-gpui-70df9440efb8952f6101627031e6ffb0", path = "../../proto-ui/generated/action-control" }
verdant-collection-control = { package = "generated-gpui-6c5b18e03a083206ddf943d974a8f234", path = "../../proto-ui/generated/collection-control" }
verdant-continuous-control = { package = "generated-gpui-6bd53e72f0fd7b3a81db16604fbf69f0", path = "../../proto-ui/generated/continuous-control" }
verdant-editor-surface = { package = "generated-gpui-3fec4e74241ad010c1377652faa8d198", path = "../../proto-ui/generated/editor-surface" }
verdant-performance-key = { package = "generated-gpui-c3bf0b7be18c2a4bd7ce9691be1d5cce", path = "../../proto-ui/generated/performance-key" }
verdant-drag-source = { package = "generated-gpui-1b2b94e0deedef2032fc906c2cd605f4", path = "../../proto-ui/generated/drag-source" }
verdant-overlay-control = { package = "generated-gpui-79af091ab8718e656491e8392abc340d", path = "../../proto-ui/generated/overlay-control" }
verdant-text-field = { package = "generated-gpui-1887551ee4e208fffe868b455e86e6b8", path = "../../proto-ui/generated/text-field" }
verdant-graph-point = { package = "generated-gpui-0bee4dfffe3ff465476bc1996b16626e", path = "../../proto-ui/generated/graph-point" }
verdant-scroll-region = { package = "generated-gpui-24da97cdbdf586abad4da793d1a46cf5", path = "../../proto-ui/generated/scroll-region" }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1"
async-channel = "2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
proto-ui-gpui-native = { path = "../../proto-ui/generated/pitch-gesture-surface/.proto-ui/gpui-native", features = ["test-support"] }
