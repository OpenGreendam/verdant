[package]
name = "verdant-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Verdant 翠绿 — GPUI singing-voice editor."

[[bin]]
name = "verdant-gui"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
verdant-domain = { path = "../verdant-domain" }
verdant-session = { path = "../verdant-session" }
verdant-ui-protocol = { path = "../verdant-ui-protocol" }
verdant-backend = { path = "../verdant-backend" }
verdant-service = { path = "../verdant-service" }
verdant-audio = { path = "../verdant-audio" }
verdant-plugins = { path = "../verdant-plugins" }
verdant-import = { path = "../verdant-import" }
verdant-exchange = { path = "../verdant-exchange" }
verdant-midi = { path = "../verdant-midi" }
verdant-media = { path = "../verdant-media" }
verdant-pitch-gesture-surface = { package = "generated-gpui-cf24f4a63e06497c7d284f96518bbd7d", path = "../../proto-ui/generated/pitch-gesture-surface" }
verdant-normalized-knob = { package = "generated-gpui-f566693d5de77c3630a31c3fcc84b78e", path = "../../proto-ui/generated/normalized-knob" }
verdant-action-control = { package = "generated-gpui-0bb48e76a16ab1cf509c2ed318c81986", path = "../../proto-ui/generated/action-control" }
verdant-collection-control = { package = "generated-gpui-858132349e9c591a4ef64ccb6716f095", path = "../../proto-ui/generated/collection-control" }
verdant-continuous-control = { package = "generated-gpui-7d01816207564a6fc835c1e2d99879cd", path = "../../proto-ui/generated/continuous-control" }
verdant-editor-surface = { package = "generated-gpui-81784682f0712df350c44444ab52c0db", path = "../../proto-ui/generated/editor-surface" }
verdant-performance-key = { package = "generated-gpui-900f115712c53d0ecd4c1d5c3bf9aec9", path = "../../proto-ui/generated/performance-key" }
verdant-drag-source = { package = "generated-gpui-ef5995e06354dd7f3f4289c37aa5ee27", path = "../../proto-ui/generated/drag-source" }
verdant-overlay-control = { package = "generated-gpui-b3ef13fdcfd6ca100482a4eb2a6c6c33", path = "../../proto-ui/generated/overlay-control" }
verdant-text-field = { package = "generated-gpui-b90b57d53d23256ae6711e22560ce7f2", path = "../../proto-ui/generated/text-field" }
verdant-graph-point = { package = "generated-gpui-5e29a42c91ccdf55fde36f5aac535c7b", path = "../../proto-ui/generated/graph-point" }
verdant-scroll-region = { package = "generated-gpui-ea03381ad29c0309e03b86c331eaa2ce", path = "../../proto-ui/generated/scroll-region" }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1"
async-channel = "2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
