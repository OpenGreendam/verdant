[package]
name = "verdant-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Verdant 翠绿 — GPUI singing-voice editor."

[[bin]]
name = "verdant-gui"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# The pinned GPUI fork exposes the platform text-selection notification API.
proto-ui-gpui-native = { path = "../../proto-ui/generated/pitch-gesture-surface/.proto-ui/gpui-native", features = ["gpui-text-selection-notification"] }
verdant-domain = { path = "../verdant-domain" }
verdant-session = { path = "../verdant-session" }
verdant-ui-protocol = { path = "../verdant-ui-protocol" }
verdant-backend = { path = "../verdant-backend" }
verdant-service = { path = "../verdant-service" }
verdant-audio = { path = "../verdant-audio" }
verdant-plugins = { path = "../verdant-plugins" }
verdant-import = { path = "../verdant-import" }
verdant-exchange = { path = "../verdant-exchange" }
verdant-midi = { path = "../verdant-midi" }
verdant-media = { path = "../verdant-media" }
verdant-pitch-gesture-surface = { package = "generated-gpui-0e127593c8881e3cfbb716f56d021e88", path = "../../proto-ui/generated/pitch-gesture-surface" }
verdant-normalized-knob = { package = "generated-gpui-6df3b4baf3b871fe05f0d666d79d88a2", path = "../../proto-ui/generated/normalized-knob" }
verdant-action-control = { package = "generated-gpui-fbbe0e3ae5af96f49b0a223dd2f8db95", path = "../../proto-ui/generated/action-control" }
verdant-collection-control = { package = "generated-gpui-2ce14ca4a0013dfde972c1fba12487ff", path = "../../proto-ui/generated/collection-control" }
verdant-continuous-control = { package = "generated-gpui-0f56d5a6819f41b9780adcb3b40f63d9", path = "../../proto-ui/generated/continuous-control" }
verdant-editor-surface = { package = "generated-gpui-1095bf5e219aeb38e989ba37084c2497", path = "../../proto-ui/generated/editor-surface" }
verdant-performance-key = { package = "generated-gpui-592e87848350368d2b7ce1a771842f14", path = "../../proto-ui/generated/performance-key" }
verdant-drag-source = { package = "generated-gpui-7979336e563dd6c9a48dd40c3aecac7e", path = "../../proto-ui/generated/drag-source" }
verdant-overlay-control = { package = "generated-gpui-dbb31cd3f3da7e7935e3b34012331e0e", path = "../../proto-ui/generated/overlay-control" }
verdant-text-field = { package = "generated-gpui-b8f8e244dac0df4f4611d3e51ba13395", path = "../../proto-ui/generated/text-field" }
verdant-graph-point = { package = "generated-gpui-a65732c58dfcc8e6b9f62b38692c6a29", path = "../../proto-ui/generated/graph-point" }
verdant-scroll-region = { package = "generated-gpui-6012b390eaecf9b1d4e65f4aaf390322", path = "../../proto-ui/generated/scroll-region" }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1"
async-channel = "2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
proto-ui-gpui-native = { path = "../../proto-ui/generated/pitch-gesture-surface/.proto-ui/gpui-native", features = ["test-support"] }
