[package]
name = "verdant-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Verdant 翠绿 — GPUI singing-voice editor."

[[bin]]
name = "verdant-gui"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
verdant-domain = { path = "../verdant-domain" }
verdant-session = { path = "../verdant-session" }
verdant-ui-protocol = { path = "../verdant-ui-protocol" }
verdant-backend = { path = "../verdant-backend" }
verdant-service = { path = "../verdant-service" }
verdant-audio = { path = "../verdant-audio" }
verdant-plugins = { path = "../verdant-plugins" }
verdant-import = { path = "../verdant-import" }
verdant-exchange = { path = "../verdant-exchange" }
verdant-midi = { path = "../verdant-midi" }
verdant-media = { path = "../verdant-media" }
verdant-pitch-gesture-surface = { package = "generated-gpui-5a5c915b3ffb15f8cc428aae6bcab3d3", path = "../../proto-ui/generated/pitch-gesture-surface" }
verdant-normalized-knob = { package = "generated-gpui-562d5968f5855f76873d7b2049fb0ff3", path = "../../proto-ui/generated/normalized-knob" }
verdant-action-control = { package = "generated-gpui-3ec26fdadb89a1d1dcba6cd4f6872a52", path = "../../proto-ui/generated/action-control" }
verdant-collection-control = { package = "generated-gpui-00417588c140bae14ae5ff3fe8428dcb", path = "../../proto-ui/generated/collection-control" }
verdant-continuous-control = { package = "generated-gpui-999ff96484f96868b59348092cbab8da", path = "../../proto-ui/generated/continuous-control" }
verdant-editor-surface = { package = "generated-gpui-c318acbee9d79e95725ee1443577ab0f", path = "../../proto-ui/generated/editor-surface" }
verdant-performance-key = { package = "generated-gpui-592a72008de665f74116a4946b9a28a9", path = "../../proto-ui/generated/performance-key" }
verdant-drag-source = { package = "generated-gpui-a96925870f69e5bcf60dd743512e93c3", path = "../../proto-ui/generated/drag-source" }
verdant-overlay-control = { package = "generated-gpui-e3e79d797ceb6576527b746c508ef045", path = "../../proto-ui/generated/overlay-control" }
verdant-text-field = { package = "generated-gpui-09f7ba6999f99e99b305a3ff1cd7d415", path = "../../proto-ui/generated/text-field" }
verdant-graph-point = { package = "generated-gpui-b7adce80d2068765733236957b4d0cd5", path = "../../proto-ui/generated/graph-point" }
verdant-scroll-region = { package = "generated-gpui-b007d3339a01919a71a2ff63a02d41c4", path = "../../proto-ui/generated/scroll-region" }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1"
async-channel = "2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
proto-ui-gpui-native = { path = "../../proto-ui/generated/pitch-gesture-surface/.proto-ui/gpui-native", features = ["test-support"] }
