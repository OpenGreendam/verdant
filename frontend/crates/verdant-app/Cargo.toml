[package]
name = "verdant-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Verdant 翠绿 — GPUI singing-voice editor."

[[bin]]
name = "verdant-gui"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# Native text selection notification is a separate host capability from the Element ABI.
proto-ui-gpui-native = { version = "=0.2.0", path = "../../proto-ui/generated/pitch-gesture-surface/.proto-ui/gpui-native", features = ["gpui-text-selection-notification"] }
verdant-domain = { path = "../verdant-domain" }
verdant-session = { path = "../verdant-session" }
verdant-ui-protocol = { path = "../verdant-ui-protocol" }
verdant-backend = { path = "../verdant-backend" }
verdant-service = { path = "../verdant-service" }
verdant-audio = { path = "../verdant-audio" }
verdant-plugins = { path = "../verdant-plugins" }
verdant-import = { path = "../verdant-import" }
verdant-exchange = { path = "../verdant-exchange" }
verdant-midi = { path = "../verdant-midi" }
verdant-media = { path = "../verdant-media" }
verdant-pitch-gesture-surface = { package = "generated-gpui-b52ed869ec1a5a76be7b9293837850ec", path = "../../proto-ui/generated/pitch-gesture-surface" }
verdant-normalized-knob = { package = "generated-gpui-51ee6ccecd229ec65f76891504d689af", path = "../../proto-ui/generated/normalized-knob" }
verdant-action-control = { package = "generated-gpui-b286d126da0c73bf3a1d84949b13c25a", path = "../../proto-ui/generated/action-control" }
verdant-collection-control = { package = "generated-gpui-a5767e6167b7ae5523cc27b3938c6863", path = "../../proto-ui/generated/collection-control" }
verdant-continuous-control = { package = "generated-gpui-c418da798fb27a549347168982b07ae9", path = "../../proto-ui/generated/continuous-control" }
verdant-editor-surface = { package = "generated-gpui-d4689e3e1fc8f199cbb99d47cca12963", path = "../../proto-ui/generated/editor-surface" }
verdant-performance-key = { package = "generated-gpui-bcb9600466028d97f55418619b08f828", path = "../../proto-ui/generated/performance-key" }
verdant-drag-source = { package = "generated-gpui-29cfcd7b8359945c50f15ffd20b14ff7", path = "../../proto-ui/generated/drag-source" }
verdant-overlay-control = { package = "generated-gpui-3c96e5538cf4708f4efe8d5a58b185be", path = "../../proto-ui/generated/overlay-control" }
verdant-text-field = { package = "generated-gpui-ea1da5215512dd1041ef9decb464d3cc", path = "../../proto-ui/generated/text-field" }
verdant-graph-point = { package = "generated-gpui-cde8247b3e173b0bec12326eb2e32684", path = "../../proto-ui/generated/graph-point" }
verdant-scroll-region = { package = "generated-gpui-b839ef9e9422255d8661581dfde3da43", path = "../../proto-ui/generated/scroll-region" }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1"
async-channel = "2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Native input inspection is available only to the compiled consumer regressions.
proto-ui-gpui-native = { version = "=0.2.0", path = "../../proto-ui/generated/pitch-gesture-surface/.proto-ui/gpui-native", features = ["test-support"] }
