[package]
name = "verdant-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Verdant 翠绿 — GPUI singing-voice editor."

[[bin]]
name = "verdant-gui"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
verdant-domain = { path = "../verdant-domain" }
verdant-session = { path = "../verdant-session" }
verdant-ui-protocol = { path = "../verdant-ui-protocol" }
verdant-backend = { path = "../verdant-backend" }
verdant-service = { path = "../verdant-service" }
verdant-audio = { path = "../verdant-audio" }
verdant-plugins = { path = "../verdant-plugins" }
verdant-import = { path = "../verdant-import" }
verdant-exchange = { path = "../verdant-exchange" }
verdant-midi = { path = "../verdant-midi" }
verdant-media = { path = "../verdant-media" }
verdant-pitch-gesture-surface = { package = "generated-gpui-87e686a50966e139aa2ae0b56f9003ce", path = "../../proto-ui/generated/pitch-gesture-surface" }
verdant-normalized-knob = { package = "generated-gpui-0cf36de71f9d2939bccbb981244fc8a2", path = "../../proto-ui/generated/normalized-knob" }
verdant-action-control = { package = "generated-gpui-083d3adae8342a6e4eca3dfd32be5b9c", path = "../../proto-ui/generated/action-control" }
verdant-collection-control = { package = "generated-gpui-8f1a57b1d1b26d421743e3e7885a2efc", path = "../../proto-ui/generated/collection-control" }
verdant-continuous-control = { package = "generated-gpui-c2a9996d3db91a17fb5ad832231a2146", path = "../../proto-ui/generated/continuous-control" }
verdant-editor-surface = { package = "generated-gpui-c8f4a2f6db57cf157c2ec9072d6b2dd0", path = "../../proto-ui/generated/editor-surface" }
verdant-performance-key = { package = "generated-gpui-dd1e98bd5748fc9d3f35168446283c8d", path = "../../proto-ui/generated/performance-key" }
verdant-drag-source = { package = "generated-gpui-ffd448a2382dea37055542f851598354", path = "../../proto-ui/generated/drag-source" }
verdant-overlay-control = { package = "generated-gpui-cfcbdb3d149f3450f05ef8aea7137ede", path = "../../proto-ui/generated/overlay-control" }
verdant-text-field = { package = "generated-gpui-cbec5302486554f178cc8943db6f268d", path = "../../proto-ui/generated/text-field" }
verdant-graph-point = { package = "generated-gpui-55d2608f3a9e7d50d375258025cd7a34", path = "../../proto-ui/generated/graph-point" }
verdant-scroll-region = { package = "generated-gpui-0cdf628ad29445e5ae536edbd943ee8a", path = "../../proto-ui/generated/scroll-region" }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1"
async-channel = "2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
