[package]
name = "verdant-test-clap-instrument"
description = "Test fixture: a minimal CLAP sine instrument for the plug-in host's note path"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = ["clack-plugin", "audio-ports", "note-ports"] }
