[workspace]
resolver = "3"
members = ["crates/*", "proto-ui/generated/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
rust-version = "1.98"

[workspace.dependencies]
# One workspace native identity, checked against compiler.pin.json and Cargo's
# full resolve graph. Platform behavior is accepted separately; see P0-DECISIONS.
gpui = { git = "https://github.com/cyjin-yl/z3rm", rev = "28f0728802599ad9ac902b86e322f783081c7df3" }
gpui_platform = { git = "https://github.com/cyjin-yl/z3rm", rev = "28f0728802599ad9ac902b86e322f783081c7df3", features = ["font-kit", "x11", "wayland"] }
# The Android backend (crates/gpui_android) renders through the same pinned fork.
gpui_wgpu = { git = "https://github.com/cyjin-yl/z3rm", rev = "28f0728802599ad9ac902b86e322f783081c7df3" }
serde = { version = "1", features = ["derive", "rc"] }
semver = "1"
# Preserve binary64 values when reading scores, model metadata and numerical receipts.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
