[package]
name = "proto-ui-gpui-native"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[features]
experimental-focus-tree = []
test-support = []

[dependencies]
gpui = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "=1.13.3"
data-url = "=0.3.2"
image = { version = "=0.25.10", default-features = false }
