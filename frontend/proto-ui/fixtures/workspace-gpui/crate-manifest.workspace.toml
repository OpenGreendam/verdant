[package]
name = "generated-gpui-0123456789abcdef0123456789abcdef"
version = "0.1.0"
edition = "2021"

[lib]
name = "generated_gpui_component"
path = "Component.rs"

[dependencies]
proto-ui-gpui-native = { version = "=0.2.0", path = ".proto-ui/gpui-native" }
gpui = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
